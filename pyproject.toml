[project]
name = "vol-surface"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emery Asher", email = "easher1011@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "quantlib>=1.44",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[project.scripts]
vol-surface = "vol_surface:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
